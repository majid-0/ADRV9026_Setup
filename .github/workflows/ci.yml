name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) has no Python 3.9 any more; 24.04 still does
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no pythonnet on Linux runner)
        run: |
          python -m pip install --upgrade pip
          # pythonnet is win32-only per pyproject markers; the .NET boundary is
          # mocked in tests, so hardware-free CI installs cleanly on Linux.
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          black --check src tests
      - name: Unit tests (hardware-free)
        run: pytest -m "not hardware" --cov=adrvtrx --cov-report=term-missing
